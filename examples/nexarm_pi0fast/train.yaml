# NexArm Pi0-FAST training config — finetune from lerobot/pi0fast-base
#
# Pi0-FAST 不能从零训练：必须加载预训练 PaliGemma 2B + Gemma 300m action expert 权重。
# 因此本配置即“微调”入口：pretrained_path 指向 HuggingFace 上的官方基座。
#
# 训练硬件假设：48GB 显存 GPU（3B 全量 AdamW bf16 需 ~40GB，48GB 充足）。
# 训练产物为 bf16 权重（~4.6GB），可直接在 RTX 5060 8GB 上推理，无需转换。
#
# Dataset: nexarm_pi0fast/put_blue_cube_in_cup (由 record.yaml 采集)
#       或复用 nexarm_smolvla/clean (49 episodes, 29303 frames, 含 task 字段)
#
# Usage:
#   python -m lerobot.scripts.lerobot_train_yaml --config_path=examples/nexarm_pi0fast/train.yaml
#
# 首次运行会从 HuggingFace 下载:
#   - lerobot/pi0fast-base         (~5GB, 含 model.safetensors)
#   - google/paligemma-3b-pt-224   (PaliGemma tokenizer)
#   - lerobot/fast-action-tokenizer (FAST 动作分词器)
# 需联网。如离线，预先 huggingface-cli download 上述仓库到本地缓存。

dataset:
  repo_id: local/nexarm_smolvla_train
  root: datasets/nexarm_smolvla_merged/train

policy:
  type: pi0_fast

  # ===== 预训练基座（必填）=====
  # make_policy 读取 cfg.pretrained_path → 走 from_pretrained 加载 base 权重（非随机初始化）
  # 注意：这里是 lerobot 官方 pi0fast-base（已含 openpi→lerobot key 映射），不是 google/paligemma 裸权重
  pretrained_path: lerobot/pi0fast-base

  # ===== 精度（决定显存与产物 dtype）=====
  # bfloat16: 模型转 bf16（视觉塔保 fp32），训练产物 ~4.6GB，5060 8GB 可直接推理
  # float32: 产物 ~9GB，5060 8GB 无法推理 —— 不要用
  dtype: bfloat16
  device: cuda
  gradient_checkpointing: true       # 即使 48GB 也建议开启，省激活内存换更大 batch

  # ===== Action chunking（openpi 默认 10）=====
  chunk_size: 10                     # 预测 10 步动作 (0.33s @30fps)
  n_action_steps: 10                 # 执行 10 步
  max_action_tokens: 256             # FAST token 上限

  # ===== 相机 / 状态维度（NexArm 6-DOF，自动 pad 到 32）=====
  # 视觉塔对所有图像共享同一 SigLIP，相机数量灵活，无需补齐
  # max_state_dim / max_action_dim 默认 32，6 维自动 pad，无需设置

  # ===== Optimizer（openpi 默认值）=====
  optimizer_lr: 2.5e-5
  optimizer_betas: [0.9, 0.95]
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0

  # ===== Scheduler（与 steps 对齐，短训练会自动缩放 warmup/decay）=====
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 80000
  scheduler_decay_lr: 2.5e-6

  push_to_hub: false

output_dir: outputs/train/nexarm_pi0fast
job_name: nexarm_pi0fast
seed: 1000
batch_size: 8                        # 48GB + bf16 + gc 安全；显存富余可调 16
steps: 80000                         # 49 episodes, bs=8 → ~3663 steps/epoch, ≈22 epochs
save_freq: 10000                     # 共 8 个中间 checkpoint
log_freq: 100
env_eval_freq: 99999                 # 无仿真环境，跳过 eval

wandb:
  enable: false

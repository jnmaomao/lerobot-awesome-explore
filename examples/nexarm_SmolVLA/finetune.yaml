# NexArm SmolVLA 训练配置
# Dataset: nexarm_smolvla_merged/train (100 episodes, 104615 frames)
# Eval:    nexarm_smolvla_merged/eval (10 episodes, 10464 frames) — 独立测试集，用于部署后评估
#
# Usage:
#   单卡:
#     python -m lerobot.scripts.lerobot_train_yaml \
#       --config_path=examples/nexarm_SmolVLA/finetune.yaml
#
#   双卡:
#     torchrun --nproc_per_node=2 \
#       -m lerobot.scripts.lerobot_train_yaml \
#       --config_path=examples/nexarm_SmolVLA/finetune.yaml

dataset:
  repo_id: local/nexarm_smolvla_train
  root: datasets/nexarm_smolvla_merged/train

policy:
  type: smolvla
  # --- Action chunking ---
  chunk_size: 50
  n_action_steps: 50
  # --- VLM backbone ---
  # 必须加载预训练 VLM 权重：freeze_vision_encoder=true 时若 load_vlm_weights=false，
  # 冻结的是一个随机初始化的 vision encoder，感知能力被废掉（见 modeling_smolvla.py 的告警）。
  # load_vlm_weights=true 确保 vision/language 部分使用 SmolVLM2 预训练特征。
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  load_vlm_weights: true          # 加载预训练 VLM 权重，配合下面的 freeze_vision_encoder
  # --- Vision encoder ---
  freeze_vision_encoder: true        # 保持冻结，train_expert_only 模式
  # --- Expert training ---
  train_expert_only: true
  train_state_proj: true
  # --- Image preprocessing ---
  resize_imgs_with_padding: [512, 512]
  # --- Decoding ---
  num_steps: 10
  # --- Optimizer ---
  optimizer_lr: 5.0e-5
  optimizer_weight_decay: 1.0e-10
  optimizer_grad_clip_norm: 10
  # --- Scheduler ---
  scheduler_warmup_steps: 500        # 数据量充足，warmup 保持500
  scheduler_decay_steps: 100000
  scheduler_decay_lr: 1.0e-6
  use_amp: true                     # AMP 混合精度，提升训练速度，同等时间内迭代更多
  push_to_hub: false

output_dir: outputs/train/nexarm_smolvla_finetune_merged
job_name: nexarm_smolvla_finetune_merged
seed: 1000
batch_size: 16
steps: 100000                         # 100 episodes 充足，10 epochs ≈ 13077 steps/epoch
save_freq: 10000                      # 共10个中间checkpoint
log_freq: 100
env_eval_freq: 99999                     # 无仿真环境，跳过eval

wandb:
  enable: false
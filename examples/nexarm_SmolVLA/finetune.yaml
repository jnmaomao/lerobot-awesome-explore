# NexArm SmolVLA 训练配置
# Dataset: nexarm_smolvla/merged (110 episodes, 82177 frames)
# 含静止状态样本 20 episodes
#
# Usage:
#   单卡:
#     python -m lerobot.scripts.lerobot_train_yaml \
#       --config_path=examples/nexarm_SmolVLA/finetune.yaml
#
#   双卡:
#     torchrun --nproc_per_node=2 \
#       -m lerobot.scripts.lerobot_train_yaml \
#       --config_path=examples/nexarm_SmolVLA/finetune.yaml

dataset:
  repo_id: local/nexarm_smolvla_merged
  root: datasets/nexarm_smolvla/merged

policy:
  type: smolvla
  # --- Action chunking ---
  chunk_size: 50
  n_action_steps: 50
  # --- Vision encoder ---
  freeze_vision_encoder: true        # 保持冻结，train_expert_only 模式
  # --- Expert training ---
  train_expert_only: true
  train_state_proj: true
  # --- Image preprocessing ---
  resize_imgs_with_padding: [512, 512]
  # --- Decoding ---
  num_steps: 10
  # --- Optimizer ---
  optimizer_lr: 5.0e-5
  optimizer_weight_decay: 1.0e-10
  optimizer_grad_clip_norm: 10
  # --- Scheduler ---
  scheduler_warmup_steps: 500        # 数据量更大，warmup 从300延长到500
  scheduler_decay_steps: 50000
  scheduler_decay_lr: 1.0e-6
  use_amp: false                     
  push_to_hub: false

output_dir: outputs/train/nexarm_smolvla_finetune_merged
job_name: nexarm_smolvla_finetune_merged
seed: 1000
batch_size: 16
steps: 50000
save_freq: 2000                      # 共4个中间checkpoint
log_freq: 100
eval_freq: 99999                     # 无仿真环境，跳过eval

wandb:
  enable: false
# NexArm policy inference config (rollout with recording)
# Usage: python -m lerobot.scripts.lerobot_rollout --config_path=examples/nexarm/inference.yaml --policy.path=outputs/train/nexarm_act/checkpoints/last/pretrained_model

robot:
  type: nexarm_follower
  port: /dev/ttyUSB0          # Follower (slave) ESP32 serial port
                       # Windows: COM19  |  Linux: /dev/ttyUSB1  |  macOS: /dev/tty.usbserial-120
  baudrate: 1000000
  disable_torque_on_disconnect: true    # 断开时松力矩，防止维持收缩姿态

  # ===== Safety Parameters =====
  # State anomaly detection: values within this margin from 0 or 4095 are considered
  # drop-packet errors. Set to 0 to disable. Default: 100 (safe range [100, 3995])
  state_safety_margin: 100

  # Consecutive anomaly threshold: log severe warning when exceeded
  # Default: 5 frames (~0.17s at 30 FPS)
  max_consecutive_anomalies: 5

  # Maximum relative movement per step: prevents sudden jerky motions
  # Default: 500 (~12% of full range [0, 4095]). Set to 4095 to disable.
  max_relative_target: 500

  cameras:
    front:
      type: opencv
      index_or_path: 6
      width: 640
      height: 480
      fps: 30
    wrist:
      type: opencv
      index_or_path: 4
      width: 640
      height: 480
      fps: 30

strategy:
  type: sentry

dataset:
  repo_id: rollout_nexarm_pick
  single_task: "pick up the object"
  fps: 30
  video: true
  push_to_hub: false
  streaming_encoding: true

fps: 30
duration: 30
return_to_initial_position: false       # 禁用归位，保持推理最后一帧姿态
device: cuda
task: "pick up the object"
display_data: false
play_sounds: false

dataset:
  repo_id: local/nexarm_smolvla_train
  root: datasets/nexarm_smolvla_merged/train

policy:
  type: act
  push_to_hub: false

output_dir: outputs/train/nexarm_act
job_name: nexarm_act
seed: 1000
batch_size: 12
steps: 80000                        # 100 episodes, ~8 epochs (steps_per_epoch ≈ 104615/12 ≈ 8718)
save_freq: 10000
log_freq: 100
env_eval_freq: 99999

wandb:
  enable: false